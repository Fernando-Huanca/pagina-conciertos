<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <div class="contenedor">
        <form action="" name="">
            <h4>Contáctenos</h4> <br>
            <input type="text" name="nombre" placeholder="Nombre Completo"> <br><br>
            <input type="number" name="telefono" placeholder="Número de Teléfono"> <br><br>
            <input type="email" name="correo" placeholder="Correo Electrónico"> <br><br>
            <textarea name="Mensaje" rows="7" cols="300" id="coment" placeholder="Escribe tu comentario"></textarea>
            <br><br>
            <input type="submit" value="Enviar" id="submit" class="boton">
        </form>
    </div>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            font-size: 15px;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(48, 47, 47);
        }

        .contenedor {
            /* width: 500px; */
            background: linear-gradient(90deg,rgba(2, 0, 36, 1) 0%, rgba(63, 63, 143, 1) 35%, rgba(0, 212, 255, 1) 100%);
            padding: 30px;
            border-radius: 10px;
            margin-left: 30%;
            margin-right: 30%;
        }

        textarea {
            width: 100%;
            margin-bottom: 10px;
        }

        h4 {
            font-size: 23px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }

        #submit{
            border-radius: 50px;
            background-color: brown;
            border: none;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            color: white;
        }

        #submit:hover{
            background-color: rgb(207, 61, 61);

        }

        @media (max-width: 768px) {
            .contenedor {
                /* width: 500px; */
                background-color: rgb(55, 216, 221);
                padding: 30px;
                border-radius: 10px;
                margin-left: 5%;
                margin-right: 5%;
            }
        }
    </style>
</body>

</html>
